<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f35" />
      <stop offset="100%" stop-color="#03191e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C800" />
      <stop offset="100%" stop-color="#D4AF4A" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Gold Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.4" />

  <!-- Shopping Bag / Store Icon -->
  <g transform="translate(106, 80)">
    <!-- Handles -->
    <path d="M 90,130 C 90,40 210,40 210,130" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" />

    <!-- Main Bag Body -->
    <path d="M 30,120 L 270,120 L 290,340 C 290,355 275,370 260,370 L 40,370 C 25,370 10,355 10,340 Z" fill="url(#goldGrad)" />

    <!-- Styled "I" Monogram Emblem in Bag -->
    <text x="150" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" fill="#082f35">I</text>
  </g>
</svg>
